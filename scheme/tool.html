<!-- PaintDial colour scheme planner. gen_pages.py drops this into /colour-scheme-planner/ inside
     the site's header and footer. Styles are scoped under #sp. It reuses the visualiser's library
     (/paint-visualiser/colours.json) and colour maths (/paint-visualiser/vis-core.js), so slugs and
     match distances are the site's own. Nothing is uploaded: the scheme lives in this browser
     (localStorage) and, when shared, in the link itself. -->
<style>
#sp{font-size:15px;line-height:1.5;--pick:#5E7E8B}
#sp p,#sp ul,#sp li,#sp h2,#sp h3{margin:0;max-width:none}#sp p,#sp li{font-size:inherit}
#sp button,#sp input{font:inherit;color:inherit}
#sp [hidden]{display:none!important}
#sp a{color:var(--pick)}
#sp :focus-visible{outline:2px solid var(--pick);outline-offset:2px}
#sp .sp-lead{margin-bottom:22px}#sp .sp-lead h1{margin:8px 0 12px}#sp .sp-lead p{max-width:640px;margin-bottom:0}
#sp .sp-shared{background:#fff;border:1px solid var(--hairline);border-left:4px solid var(--pick);border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#sp .sp-shared span{flex:1 1 260px;font-size:14px}
#sp .sp-top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:18px}
#sp .sp-title{flex:1 1 240px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#sp .sp-title input{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);background:#fff;border:1px solid var(--hairline);border-radius:9px;padding:8px 12px;width:100%}
#sp .sp-acts{display:flex;flex-wrap:wrap;gap:8px}
#sp .sp-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.2}
#sp .sp-btn-ghost{background:#fff;color:var(--ink);border-color:var(--hairline)}
#sp .sp-btn:disabled{opacity:.45;cursor:default}
#sp .sp-link{border:none;background:none;padding:0;color:var(--pick);font-size:12.5px;font-weight:600;cursor:pointer}
#sp .sp-link:hover{text-decoration:underline}
#sp .sp-link-warn{color:#9A6B6B}
#sp .sp-room-head .sp-link{white-space:nowrap;flex:none}
#sp .sp-flow{margin-bottom:20px}
#sp .sp-flow b{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#sp .sp-flow-row{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--hairline)}
#sp .sp-flow-row div{flex:1 1 0;min-width:0;height:74px;display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-weight:600;line-height:1.2}
#sp .sp-flow-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sp .sp-room{background:#fff;border:1px solid var(--hairline);border-radius:14px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px 20px}
#sp .sp-room-head{grid-column:1/-1;display:flex;gap:10px;align-items:center}
#sp .sp-rname{flex:1 1 auto;min-width:0;font-family:var(--serif);font-size:19px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:3px 7px;margin-left:-7px;background:transparent}
#sp .sp-rname:hover,#sp .sp-rname:focus{border-color:var(--hairline);background:#fff}
#sp .sp-pv{border-radius:10px;overflow:hidden;border:1px solid var(--hairline);display:flex;flex-direction:column;height:170px;align-self:start}
#sp .sp-pv i{display:block}
#sp .pv-c{height:16%}#sp .pv-w{flex:1 1 auto;position:relative}#sp .pv-t{height:9%}
#sp .pv-a{position:absolute;right:14%;bottom:0;width:26%;height:72%;border-radius:3px 3px 0 0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
#sp .pv-none{background:repeating-linear-gradient(135deg,#F4F1EA 0 6px,#ECE8DF 6px 12px)}
#sp .sp-rows{display:flex;flex-direction:column}
#sp .sp-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid #EEEAE1;text-align:left}
#sp .sp-row:first-child{border-top:none;padding-top:2px}
#sp .sp-sw{width:44px;height:44px;border-radius:9px;border:1px solid rgba(0,0,0,.1);cursor:pointer;padding:0;display:block}
#sp button.sp-row{background:none;border:none;border-top:1px solid #EEEAE1;width:100%;cursor:pointer;align-items:center}
#sp button.sp-row:first-child{border-top:none}
#sp .sp-sw-empty{display:flex;align-items:center;justify-content:center;background:#F7F5F0;border:1px dashed #C9C3B6;color:var(--muted);font-size:20px;line-height:1}
#sp .sp-k{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#sp .sp-name{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);text-decoration:none}
#sp .sp-name:hover{text-decoration:underline}
#sp .sp-sub{display:block;font-size:12.5px;color:var(--muted)}
#sp .sp-choose{font-size:14px;color:var(--pick);font-weight:600}
#sp .sp-rowacts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px}
#sp details.sp-alt{margin-top:6px}
#sp details.sp-alt summary{font-size:12.5px;font-weight:600;color:var(--pick);cursor:pointer;list-style:none}
#sp details.sp-alt summary::-webkit-details-marker{display:none}
#sp details.sp-alt summary::after{content:" +"}#sp details.sp-alt[open] summary::after{content:" \2013"}
#sp .sp-alt-list{margin-top:6px;display:flex;flex-direction:column;gap:6px}
#sp .sp-alt-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
#sp .sp-alt-item i{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.1);display:block}
#sp .sp-alt-item small{color:var(--muted);display:block}
#sp .sp-add{margin:4px 0 14px}
#sp .sp-add b{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
#sp .sp-presets{display:flex;flex-wrap:wrap;gap:8px}
#sp .sp-chip{border:1px solid var(--hairline);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer}
#sp .sp-chip:hover{border-color:var(--muted)}
#sp .sp-note{font-size:12.5px;color:var(--muted);margin-top:6px}
#sp .sp-flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;z-index:1200;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw}
#sp .sp-flash button{border:none;background:none;color:#fff;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
#sp .sp-sheet{position:fixed;inset:0;z-index:1100;background:rgba(33,31,27,.45);display:flex;align-items:flex-end;justify-content:center}
#sp .sp-sheet-in{background:#fff;width:min(560px,100%);max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px 16px 0}
#sp .sp-sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#sp .sp-sheet-head b{flex:1 1 auto;font-family:var(--serif);font-size:18px;font-weight:600}
#sp .sp-x{border:none;background:#F1EEE7;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}
#sp .sp-q{width:100%;border:1px solid var(--hairline);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
#sp .sp-res{overflow-y:auto;padding:10px 0 16px;-webkit-overflow-scrolling:touch}
#sp .sp-res h3{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
#sp .sp-opt{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:6px 4px;border-radius:9px;cursor:pointer}
#sp .sp-opt:hover,#sp .sp-opt:focus-visible{background:#F7F5F0}
#sp .sp-opt i{width:38px;height:38px;border-radius:8px;border:1px solid rgba(0,0,0,.1);display:block}
#sp .sp-opt b{display:block;font-weight:600;font-size:14.5px}
#sp .sp-opt small{display:block;font-size:12px;color:var(--muted)}
#sp .sp-hint{font-size:13.5px;color:var(--muted);padding:8px 2px}
#sp .sp-print{display:none}
@media(min-width:700px){#sp .sp-sheet{align-items:center}#sp .sp-sheet-in{border-radius:16px;max-height:78vh}}
@media(max-width:620px){
  #sp .sp-room{grid-template-columns:minmax(0,1fr);padding:14px}
  #sp .sp-pv{height:110px}
  #sp .sp-acts{width:100%}#sp .sp-acts .sp-btn{flex:1 1 0}
  #sp .sp-flow-row div{height:60px;font-size:10px;padding:5px 6px}
}
@media print{
  html,body{background:#fff!important}
  .wrap{max-width:none!important;padding:0!important}
  .wrap>*:not(#sp){display:none!important}
  #sp>*:not(.sp-print){display:none!important}
  #sp .sp-print{display:block;color:#000;font-size:11pt}
  #sp .sp-print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #sp .sp-print h2{font-family:var(--serif);font-size:20pt;margin:0 0 2pt}
  #sp .sp-print .pr-sub{font-size:9.5pt;color:#444;margin-bottom:12pt}
  #sp .sp-print table{width:100%;border-collapse:collapse;margin-bottom:12pt}
  #sp .sp-print th{text-align:left;font-size:8pt;letter-spacing:.08em;text-transform:uppercase;color:#555;border-bottom:1.2pt solid #000;padding:4pt 6pt 4pt 0}
  #sp .sp-print td{border-bottom:.6pt solid #bbb;padding:6pt 6pt 6pt 0;vertical-align:middle;font-size:10.5pt}
  #sp .sp-print tr{break-inside:avoid}
  #sp .sp-print .pr-room td{font-family:var(--serif);font-weight:600;font-size:12.5pt;border-bottom:none;padding-top:12pt}
  #sp .sp-print .pr-sw{display:inline-block;width:34pt;height:22pt;border:.6pt solid #888;border-radius:2pt;vertical-align:middle}
  #sp .sp-print .pr-foot{font-size:9pt;color:#444;margin-top:8pt}
  #sp .sp-print small{color:#555;font-size:9pt}
}
</style>
<div id="sp">
<div class="sp-lead"><!--SP-LEAD--></div>
<div class="sp-shared" id="spShared" hidden>
  <span>This scheme was shared with you. Your own saved scheme hasn’t been touched.</span>
  <button class="sp-btn" id="spKeep" type="button">Keep this as my scheme</button>
  <button class="sp-btn sp-btn-ghost" id="spMine" type="button">Go to my scheme</button>
</div>
<div class="sp-top">
  <label class="sp-title">Scheme name<input id="spTitle" type="text" maxlength="40" placeholder="Our house" autocomplete="off"></label>
  <div class="sp-acts">
    <button class="sp-btn" id="spShare" type="button">Copy link to share</button>
    <button class="sp-btn sp-btn-ghost" id="spPrint" type="button">Print colour schedule</button>
  </div>
</div>
<div class="sp-flow" id="spFlow" hidden></div>
<div id="spRooms"></div>
<div class="sp-add"><b id="spAddH">Add a room</b><div class="sp-presets" id="spPresets"></div></div>
<p class="sp-note">Your scheme is saved in this browser, on this device. Nothing is uploaded. Screens don’t show paint exactly, so order testers before you buy.</p>
<div class="sp-sheet" id="spSheet" hidden role="dialog" aria-modal="true" aria-labelledby="spSheetH">
  <div class="sp-sheet-in">
    <div class="sp-sheet-head"><b id="spSheetH"></b><button class="sp-x" id="spClose" type="button" aria-label="Close">×</button></div>
    <input class="sp-q" id="spQ" type="search" placeholder="Search by colour name or code" autocomplete="off" aria-label="Search paints by name or code">
    <div class="sp-res" id="spRes"></div>
  </div>
</div>
<div class="sp-flash" id="spFlash" hidden role="status"></div>
<div class="sp-print" id="spPrintOut"></div>
</div>
<script src="/paint-visualiser/vis-core.js"></script>
<script>
(function(){
  'use strict';
  var KEY='pd_scheme_v1', SLKEY='pd_shortlist_v1', MAXR=12, PATH='/colour-scheme-planner/';
  var SURF=[['w','Walls'],['t','Woodwork'],['c','Ceiling'],['a','Accent']];
  var PRESETS=['Living room','Kitchen','Hall','Dining room','Bedroom','Bathroom','Landing','Study'];
  var $=function(id){return document.getElementById(id);};
  var lib=null, bySlug=new Map(), S={t:'',r:[]}, sharedView=false, mine=null, pick=null, undo=null, flashT=0;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function cleanName(s){return String(s||'').replace(/[:~]/g,' ').replace(/\s+/g,' ').trim().slice(0,30);}
  function ink(hex){var o=VisCore.oklab(hex);return o[0]>0.62?'#211F1B':'#FFFFFF';}
  function col(slug){return slug?bySlug.get(slug)||null:null;}
  function sub(c){return esc(c.brand)+(c.code?' · '+esc(c.code):'');}

  /* ---- the scheme as text: Room:walls.woodwork.ceiling.accent~Room:... (slugs are a-z, 0-9 and -) ---- */
  function encode(s){
    return s.r.map(function(r){return encodeURIComponent(cleanName(r.n)||'Room')+':'+SURF.map(function(k){return r.s[k[0]]||'';}).join('.');}).join('~');
  }
  function shareURL(){
    return location.origin+PATH+'?s='+encode(S)+(S.t?'&t='+encodeURIComponent(S.t):'');
  }
  function decode(str,title){
    var out={t:String(title||'').slice(0,40),r:[]};
    String(str||'').split('~').slice(0,MAXR).forEach(function(part){
      var i=part.lastIndexOf(':'); if(i<0) return;
      var name=cleanName(part.slice(0,i))||'Room', sl=part.slice(i+1).split('.'), s={};
      SURF.forEach(function(k,j){ if(sl[j]&&bySlug.has(sl[j])) s[k[0]]=sl[j]; });
      out.r.push({n:name,s:s});
    });
    return out;
  }
  function tidy(o){   // anything read from storage is checked the same way as a link
    var out={t:String((o&&o.t)||'').slice(0,40),r:[]};
    ((o&&o.r)||[]).slice(0,MAXR).forEach(function(r){
      var s={}; SURF.forEach(function(k){var v=r&&r.s&&r.s[k[0]]; if(v&&bySlug.has(v)) s[k[0]]=v;});
      out.r.push({n:cleanName(r&&r.n)||'Room',s:s});
    });
    return out;
  }
  function readMine(){try{var o=JSON.parse(localStorage.getItem(KEY));return o?tidy(o):null;}catch(e){return null;}}
  function save(){ if(sharedView) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
  function shortlist(){
    var a=[]; try{a=JSON.parse(localStorage.getItem(SLKEY))||[];}catch(e){}
    var out=[];
    a.forEach(function(it){
      var hit=null;
      for(var i=0;i<lib.list.length;i++){var c=lib.list[i];
        if(c.name===it.name&&c.brand===it.brand){ if(!hit||c.hex.toLowerCase()===String(it.hex||'').toLowerCase()) hit=c; }
      }
      if(hit&&out.indexOf(hit)<0) out.push(hit);
    });
    return out;
  }
  function used(){
    var out=[]; S.r.forEach(function(r){SURF.forEach(function(k){var c=col(r.s[k[0]]); if(c&&out.indexOf(c)<0) out.push(c);});});
    return out;
  }
  function alts(c){
    return VisCore.bestPerBrand(lib,c.i,3).map(function(m){return {c:lib.list[m.j],w:VisCore.closenessWord(m.d)};}).filter(function(m){return m.w;});
  }

  function flash(msg,undoFn){
    var f=$('spFlash'); undo=undoFn||null;
    f.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" id="spUndo">Undo</button>':'');
    f.hidden=false; clearTimeout(flashT); flashT=setTimeout(function(){f.hidden=true;undo=null;},undo?6000:2200);
    if(undo) $('spUndo').onclick=function(){var u=undo;undo=null;f.hidden=true;u();};
  }

  /* ---- drawing ---- */
  function roomHTML(r,ri){
    var c={}; SURF.forEach(function(k){c[k[0]]=col(r.s[k[0]]);});
    var pv='<div class="sp-pv" aria-hidden="true">'+
      '<i class="pv-c'+(c.c?'" style="background:'+c.c.hex+'"':' pv-none"')+'></i>'+
      '<i class="pv-w'+(c.w?'" style="background:'+c.w.hex+'"':' pv-none"')+'>'+(c.a?'<i class="pv-a" style="background:'+c.a.hex+'"></i>':'')+'</i>'+
      '<i class="pv-t'+(c.t?'" style="background:'+c.t.hex+'"':' pv-none"')+'></i></div>';
    var rows=SURF.map(function(k){
      var key=k[0], label=k[1], x=c[key], d=' data-r="'+ri+'" data-k="'+key+'"';
      if(!x) return '<button type="button" class="sp-row" data-act="pick"'+d+'><span class="sp-sw sp-sw-empty" aria-hidden="true">+</span>'+
        '<span><span class="sp-k">'+label+'</span><span class="sp-choose">Choose a colour</span></span></button>';
      var al=alts(x), others=S.r.length>1&&(key==='t'||key==='c')&&S.r.some(function(o){return o.s[key]!==r.s[key];});
      return '<div class="sp-row"><button type="button" class="sp-sw" style="background:'+x.hex+'" data-act="pick"'+d+' aria-label="Change the '+label.toLowerCase()+' colour for '+esc(r.n)+'"></button>'+
        '<div><span class="sp-k">'+label+'</span><a class="sp-name" href="/colours/'+x.slug+'">'+esc(x.name)+'</a><span class="sp-sub">'+sub(x)+'</span>'+
        '<div class="sp-rowacts"><button type="button" class="sp-link" data-act="pick"'+d+'>Change</button>'+
        (others?'<button type="button" class="sp-link" data-act="all"'+d+'>Use in every room</button>':'')+
        '<button type="button" class="sp-link sp-link-warn" data-act="clear"'+d+'>Remove</button></div>'+
        (al.length?'<details class="sp-alt"><summary>Closest in other brands</summary><div class="sp-alt-list">'+al.map(function(m){
          return '<div class="sp-alt-item"><i style="background:'+m.c.hex+'"></i><span><a href="/colours/'+m.c.slug+'">'+esc(m.c.name)+'</a> <small>'+esc(m.c.brand)+', '+m.w+'</small></span>'+
            '<button type="button" class="sp-link" data-act="use"'+d+' data-slug="'+m.c.slug+'">Use this</button></div>';
        }).join('')+'</div></details>':'')+
        '</div></div>';
    }).join('');
    return '<section class="sp-room"><div class="sp-room-head"><input class="sp-rname" type="text" maxlength="30" value="'+esc(r.n)+'" data-r="'+ri+'" aria-label="Room name">'+
      '<button type="button" class="sp-link sp-link-warn" data-act="del" data-r="'+ri+'">Remove room</button></div>'+pv+'<div class="sp-rows">'+rows+'</div></section>';
  }
  function draw(){
    $('spRooms').innerHTML=S.r.map(roomHTML).join('');
    var walls=S.r.filter(function(r){return col(r.s.w);});
    var fl=$('spFlow');
    if(walls.length>=2){
      fl.hidden=false;
      fl.innerHTML='<b>The walls, side by side</b><div class="sp-flow-row">'+walls.map(function(r){var x=col(r.s.w);
        return '<div style="background:'+x.hex+';color:'+ink(x.hex)+'"><span>'+esc(r.n)+'</span></div>';}).join('')+'</div>';
    } else fl.hidden=true;
    $('spAddH').textContent=S.r.length?'Add a room':'Start with a room';
    $('spPresets').innerHTML=S.r.length>=MAXR?'<span class="sp-hint">That’s the most rooms one scheme can hold.</span>':
      PRESETS.filter(function(p){return !S.r.some(function(r){return r.n===p;});}).map(function(p){
        return '<button type="button" class="sp-chip" data-preset="'+esc(p)+'">'+esc(p)+'</button>';}).join('')+
      '<button type="button" class="sp-chip" data-preset="">Another room</button>';
    var any=used().length>0;
    $('spShare').disabled=!any; $('spPrint').disabled=!any;
    $('spShared').hidden=!sharedView;
    if(document.activeElement!==$('spTitle')) $('spTitle').value=S.t;
  }
  function changed(){save();draw();}

  /* ---- the colour picker ---- */
  function optHTML(c){return '<button type="button" class="sp-opt" data-slug="'+c.slug+'"><i style="background:'+c.hex+'"></i><span><b>'+esc(c.name)+'</b><small>'+sub(c)+'</small></span></button>';}
  function drawPicker(){
    var q=$('spQ').value.trim(), h='';
    if(q){
      var res=VisCore.search(lib,q,40);
      h=res.length?res.map(optHTML).join(''):'<p class="sp-hint">Nothing in the library matches that. Try part of the name, or the brand’s code.</p>';
    } else {
      var sl=shortlist(), us=used();
      if(sl.length) h+='<h3>From your shortlist</h3>'+sl.map(optHTML).join('');
      if(us.length) h+='<h3>Already in this scheme</h3>'+us.map(optHTML).join('');
      if(!h) h='<p class="sp-hint">Search for a colour above. Anything you save to your shortlist elsewhere on PaintDial will be listed here too.</p>';
    }
    $('spRes').innerHTML=h;
  }
  function openPicker(ri,key){
    var r=S.r[ri]; if(!r) return;
    pick={r:ri,k:key,from:document.activeElement};
    var label=SURF.filter(function(k){return k[0]===key;})[0][1];
    $('spSheetH').textContent=label+', '+r.n;
    $('spQ').value=''; drawPicker(); $('spSheet').hidden=false;
    document.documentElement.style.overflow='hidden';
    if(!shortlist().length&&!used().length) $('spQ').focus(); else $('spClose').focus();
  }
  function closePicker(){
    $('spSheet').hidden=true; document.documentElement.style.overflow='';
    if(pick&&pick.from&&pick.from.focus) try{pick.from.focus();}catch(e){}
    pick=null;
  }

  /* ---- printing ---- */
  function buildPrint(){
    var d=new Date(), date=d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear();
    var h='<h2>'+esc(S.t||'Colour schedule')+'</h2><div class="pr-sub">Colour schedule, '+date+'. Made with PaintDial, paintdial.co.uk</div>'+
      '<table><thead><tr><th>Surface</th><th></th><th>Colour</th><th>Brand</th><th>Code</th><th>Closest in another brand</th></tr></thead><tbody>';
    S.r.forEach(function(r){
      var rows=SURF.map(function(k){var x=col(r.s[k[0]]); if(!x) return '';
        var al=alts(x)[0];
        return '<tr><td>'+k[1]+'</td><td><span class="pr-sw" style="background:'+x.hex+'"></span></td><td>'+esc(x.name)+'</td><td>'+esc(x.brand)+'</td><td>'+esc(x.code||'')+'</td>'+
          '<td>'+(al?esc(al.c.name)+' <small>'+esc(al.c.brand)+', '+al.w+'</small>':'')+'</td></tr>';}).join('');
      if(rows) h+='<tr class="pr-room"><td colspan="6">'+esc(r.n)+'</td></tr>'+rows;
    });
    h+='</tbody></table><div class="pr-foot">Printed and on-screen colours are a guide only. Check the name and code against the brand’s own colour card, and try a tester in the room before you buy.</div>';
    $('spPrintOut').innerHTML=h;
  }

  /* ---- events ---- */
  $('spRooms').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var ri=+b.dataset.r, key=b.dataset.k, r=S.r[ri], act=b.dataset.act; if(!r) return;
    if(act==='pick') openPicker(ri,key);
    else if(act==='clear'){ delete r.s[key]; changed(); }
    else if(act==='use'){ if(bySlug.has(b.dataset.slug)){ r.s[key]=b.dataset.slug; changed(); } }
    else if(act==='all'){ var before=JSON.stringify(S.r), v=r.s[key]; S.r.forEach(function(o){o.s[key]=v;}); changed();
      flash('Used in every room.',function(){S.r=JSON.parse(before);changed();}); }
    else if(act==='del'){ var gone=S.r.splice(ri,1)[0]; changed();
      flash(gone.n+' removed.',function(){S.r.splice(Math.min(ri,S.r.length),0,gone);changed();}); }
  });
  $('spRooms').addEventListener('change',function(e){
    var i=e.target.closest('.sp-rname'); if(!i) return;
    var r=S.r[+i.dataset.r]; if(!r) return; r.n=cleanName(i.value)||'Room'; changed();
  });
  $('spPresets').addEventListener('click',function(e){
    var b=e.target.closest('[data-preset]'); if(!b||S.r.length>=MAXR) return;
    var name=b.dataset.preset, n=2;
    if(!name){ name='Room'; while(S.r.some(function(r){return r.n===name;})) name='Room '+(n++); }
    S.r.push({n:name,s:{}}); changed();
    var inputs=document.querySelectorAll('#sp .sp-rname'), last=inputs[inputs.length-1];
    if(last){ last.closest('.sp-room').scrollIntoView({block:'nearest',behavior:'smooth'}); if(!b.dataset.preset){ last.focus(); last.select(); } }
  });
  $('spTitle').addEventListener('input',function(){S.t=this.value.slice(0,40);save();});
  $('spQ').addEventListener('input',drawPicker);
  $('spRes').addEventListener('click',function(e){
    var b=e.target.closest('.sp-opt'); if(!b||!pick) return;
    var r=S.r[pick.r]; if(r&&bySlug.has(b.dataset.slug)) r.s[pick.k]=b.dataset.slug;
    closePicker(); changed();
  });
  $('spClose').addEventListener('click',closePicker);
  $('spSheet').addEventListener('click',function(e){ if(e.target===this) closePicker(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('spSheet').hidden) closePicker(); });
  $('spShare').addEventListener('click',function(){
    var url=shareURL();
    var done=function(){flash('Link copied. Anyone who opens it sees this scheme.');};
    var fallback=function(){
      var t=document.createElement('textarea'); t.value=url; t.setAttribute('readonly',''); t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select(); var ok=false; try{ok=document.execCommand('copy');}catch(e){} t.remove();
      if(ok) done(); else flash('Couldn’t copy. The link is in the address bar now.'), history.replaceState(null,'',url);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,fallback); else fallback();
  });
  $('spPrint').addEventListener('click',function(){buildPrint();window.print();});
  window.addEventListener('beforeprint',buildPrint);
  $('spKeep').addEventListener('click',function(){sharedView=false;save();mine=null;history.replaceState(null,'',PATH);draw();flash('Saved as your scheme.');});
  $('spMine').addEventListener('click',function(){sharedView=false;S=mine||{t:'',r:[]};mine=null;history.replaceState(null,'',PATH);draw();});

  /* ---- start ---- */
  fetch('/paint-visualiser/colours.json').then(function(r){return r.json();}).then(function(data){
    lib=VisCore.buildLibrary(data);
    lib.list.forEach(function(c){bySlug.set(c.slug,c);});
    var q=new URLSearchParams(location.search), saved=readMine();
    if(q.get('s')){
      var inc=decode(q.get('s'),q.get('t'));
      var same=saved&&encode(saved)===encode(inc)&&saved.t===inc.t;
      if(!saved||!saved.r.length||same){ S=same?saved:inc; save(); history.replaceState(null,'',PATH); }
      else { S=inc; mine=saved; sharedView=true; }
    } else if(saved) S=saved;
    draw();
  }).catch(function(){
    $('spRooms').innerHTML='<p class="sp-hint">The colour library didn’t load. Check your connection and reload the page.</p>';
  });
})();
</script>
