# PaintDial — Netlify config (git build).
[build]
  command = "bash build.sh"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# --- Domain consolidation: everything lands on https://www.paintdial.co.uk ---
# force = true is required. Without it Netlify serves the existing file first and
# the rule never fires — which is why paintdial.com/ used to return 200 with the
# .gitignore contents. Shipped 26 Jul 2026, verified 301 on apex, www and deep paths.
# The paintdial.com domain ALIAS must stay in place on Netlify for these to fire.
# Do NOT "Remove domain" — that kills the redirect instead of serving it.

[[redirects]]
  from = "https://storied-cassata-d25ad3.netlify.app/*"
  to = "https://www.paintdial.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://paintdial.com/*"
  to = "https://www.paintdial.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.paintdial.com/*"
  to = "https://www.paintdial.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://paintdial.com/*"
  to = "https://www.paintdial.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.paintdial.com/*"
  to = "https://www.paintdial.co.uk/:splat"
  status = 301
  force = true

# --- Valspar encoding repair (Aug 2026): five names had a U+FFFD replacement
# character where an accent should be. base_slug() strips accents to ASCII, so
# repairing the name also changes the slug. Explicit 301s so the old URLs don't
# 404. Explicit rules only — splat/placeholder patterns are unreliable here.
# Old slugs had zero impressions at the time of the change; these are belt-and-braces.

[[redirects]]
  from = "/colours/valspar-chteau-mantle"
  to = "/colours/valspar-chateau-mantle"
  status = 301

[[redirects]]
  from = "/colours/valspar-clementine-crme"
  to = "/colours/valspar-clementine-creme"
  status = 301

[[redirects]]
  from = "/colours/valspar-consomm"
  to = "/colours/valspar-consomme"
  status = 301

[[redirects]]
  from = "/colours/valspar-crme-de-menthe"
  to = "/colours/valspar-creme-de-menthe"
  status = 301

[[redirects]]
  from = "/colours/valspar-dj-blue"
  to = "/colours/valspar-deja-blue"
  status = 301

# --- COAT ampersand repair (Oct 2026): three names were stored HTML-escaped
# ("Smith &amp; The Devil"), so base_slug() produced "-andamp-" slugs and the
# pages rendered the entity literally. Names repaired in paints-fixed.json and
# index.html; slugs changed as a result. Explicit 301s for the colour page and
# the alternatives page of each, same approach as the Valspar block above.

[[redirects]]
  from = "/colours/coat-smith-andamp-the-devil"
  to = "/colours/coat-smith-and-the-devil"
  status = 301

[[redirects]]
  from = "/alternatives/coat-smith-andamp-the-devil"
  to = "/alternatives/coat-smith-and-the-devil"
  status = 301

[[redirects]]
  from = "/colours/coat-gown-andamp-out"
  to = "/colours/coat-gown-and-out"
  status = 301

[[redirects]]
  from = "/alternatives/coat-gown-andamp-out"
  to = "/alternatives/coat-gown-and-out"
  status = 301

[[redirects]]
  from = "/colours/coat-grace-andamp-favoured"
  to = "/colours/coat-grace-and-favoured"
  status = 301

[[redirects]]
  from = "/alternatives/coat-grace-andamp-favoured"
  to = "/alternatives/coat-grace-and-favoured"
  status = 301
